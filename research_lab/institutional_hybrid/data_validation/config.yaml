    timestamp_format: auto
    required: [timestamp, open, high, low, close, volume, oi, iv, strike, spot]
quality:
  pass_minimum: 90
  warning_minimum: 75
  maximum_missing_candle_pct: 1
  minimum_alignment_pct: 99
  maximum_duplicate_pct: 0
  maximum_corrupt_pct: 0
  maximum_nan_required_pct: 0
  spot_index_correlation_minimum: 0.99
  maximum_atm_distance_points: 100
  iv_units: percentage_points
