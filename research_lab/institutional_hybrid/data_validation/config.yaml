version: phase2_precheck_v1
contract: timestamped_index_plus_full_option
timezone: Asia/Kolkata
session:
  start: "09:15"
  end: "15:29"
  expected_minutes: 375
alignment:
  mode: exact
  backward_tolerance_seconds: 0
datasets:
